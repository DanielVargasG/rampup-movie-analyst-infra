---
- name: Configuracion base de todos los hosts
  hosts: role_backend:role_front
  become: true
  roles:
    - common
    - cloudwatch_agent
    - nodejs

- name: Configuracion especifica del backend
  hosts: role_backend
  become: true
  roles:
    - backend

- name: Configuracion especifica del frontend
  hosts: role_front
  become: true
  vars:
    backend_url: "internal-qa-alb-1482330785.us-east-2.elb.amazonaws.com:80"
  roles:
    - frontend