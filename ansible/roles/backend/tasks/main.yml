---
- name: Clonar repositorio de la aplicacion
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dest }}"
    version: master
    force: true
  become: true

- name: Asegurar que appuser sea dueno del repositorio
  ansible.builtin.file:
    path: "{{ repo_dest }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    recurse: true
  become: true

- name: Fijar variables de BD leidas desde SSM
  ansible.builtin.set_fact:
    db_host: "{{ lookup('amazon.aws.aws_ssm', '/rampup/qa/db/host', region='us-east-2') }}"
    db_name: "{{ lookup('amazon.aws.aws_ssm', '/rampup/qa/db/name', region='us-east-2') }}"
    db_app_username: "{{ lookup('amazon.aws.aws_ssm', '/rampup/qa/db/app_username', region='us-east-2') }}"
    db_app_password: "{{ lookup('amazon.aws.aws_ssm', '/rampup/qa/db/app_password', region='us-east-2') }}"
  no_log: true

- name: Escribir archivo de entorno del backend
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ repo_dest }}/{{ backend_subdir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  become: true
  notify: Reiniciar backend

- name: Instalar dependencias npm
  community.general.npm:
    path: "{{ repo_dest }}/{{ backend_subdir }}"
  become: true

- name: Instalar unit de systemd para el backend
  ansible.builtin.template:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service
    mode: "0644"
  become: true
  notify:
    - Recargar systemd
    - Reiniciar backend

- name: Habilitar e iniciar el servicio backend
  ansible.builtin.systemd:
    name: backend
    enabled: true
    state: started
  become: true